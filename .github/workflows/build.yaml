name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly published vulnerabilities surface without a push.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Builds with the Go version go.mod declares, the module's minimum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated code
        run: |
          go generate ./...
          git diff --exit-code

      - name: Check formatting, go.mod, vet and staticcheck
        run: make check

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Summarize coverage
        run: go tool cover -func=coverage.out -o=coverage-summary.out

      - name: Build
        run: make build

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage-summary.out
          if-no-files-found: error

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # govulncheck also checks the standard library of the Go it runs with.
      # Use the latest release, as users building today would, rather than
      # the older patch release that go.mod names as the minimum.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: make vuln

  coverage-badge:
    name: Update Coverage Badge
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    concurrency:
      group: coverage-badge-main
      cancel-in-progress: false

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check coverage is current
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.current.outputs.update == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download coverage reports
        if: steps.current.outputs.update == 'true'
        uses: actions/download-artifact@v7
        with:
          name: coverage

      - name: Update coverage badge
        if: steps.current.outputs.update == 'true'
        uses: tj-actions/coverage-badge-go@481919ec72da287775fef015fd9011dc75a5db05 # v3
        with:
          filename: coverage-summary.out
          link: https://github.com/sgruendel/superwhisper-sonos/actions/workflows/build.yaml

      - name: Save coverage badge
        if: steps.current.outputs.update == 'true'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'chore: update coverage badge'
          git push origin HEAD:main
